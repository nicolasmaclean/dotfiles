---
# Two machines, both configured locally. The inventory names must match what
# `hostname` actually prints on each box, because every run is limited to it:
#
#     ansible-playbook site.yml --limit "$(hostname)"
#
# That --limit is not optional. `ansible_connection: local` means *every* host in
# this file resolves to whichever machine you are sitting at, so an unlimited
# run would apply the desktop's host_vars to the laptop and vice versa.
# bootstrap.sh always passes it.

all:
  children:
    workstations:
      vars:
        # Never over SSH: each machine provisions itself. Declared here rather
        # than as `transport` in ansible.cfg so it holds regardless of which
        # config file a given invocation picks up.
        ansible_connection: local
      hosts:
        # Laptop. ThinkPad, Intel drives X. Still on Ubuntu 24.04 and therefore
        # UNMANAGED: every role here is pacman-only and site.yml's pre-task
        # asserts ansible_os_family == 'Archlinux', so a run on this box stops
        # at the assert rather than doing damage. It stays listed because it is
        # the target for the eventual reinstall, not because it is provisioned.
        unick:
        # Desktop. CachyOS, NVIDIA, dual-boot alongside Windows. The only
        # machine this playbook currently provisions.
        cnick:
