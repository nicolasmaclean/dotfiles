---
# Desktop. CachyOS, minimal profile — no desktop environment, so the playbook
# builds onto empty ground and there is nothing to purge.

# Hardware facts
form_factor: desktop
gpu: nvidia

# Apps
install_steam: true
install_battlenet: true

# Desktop environment
install_hyprland: true

# Which NVIDIA package set, named here rather than detected. `chwd` is this
# distro's `ubuntu-drivers` and has the same defect: it is not idempotent and
# reports changed every run. Ask it once by hand at install time
# (`chwd --list`), then name the answer here and let pacman be idempotent.
#
# nvidia-open only — the proprietary kernel module no longer exists in the Arch
# repos (extra/nvidia-open carries replaces=['nvidia<=580.119.02-2']). That
# constrains nothing here: this box has an RTX 3060 Ti, which is Ampere, two
# generations past nvidia-open's Turing cutoff. A pre-Turing card would need an
# AUR DKMS branch instead and would have to move the `aur` role ahead of `gpu`;
# see roles/gpu/tasks/main.yml.
#
# linux-cachyos-nvidia-open is the module prebuilt against the CachyOS kernel,
# preferred over -dkms so nothing rebuilds on every kernel update. It is
# versioned in lockstep with linux-cachyos, so the two must move in one
# transaction — which roles/base's unconditional full `pacman -Syu` guarantees.
nvidia_packages:
  - linux-cachyos-nvidia-open
  - nvidia-utils
  - lib32-nvidia-utils        # Steam
