---
# The single playbook. Every role is gated on the host_vars below and each is
# independently runnable with --tags.
#
#     ansible-playbook site.yml --limit "$(hostname)" --ask-become-pass
#
# --limit is required — see inventory/hosts.yml for why. bootstrap.sh passes it.

- name: Provision workstation
  hosts: workstations
  gather_facts: true

  pre_tasks:
    # This also proves the var layout resolves, which is worth a task on its
    # own: form_factor comes from inventory/host_vars/ (inventory-adjacent)
    # while qtile_version comes from group_vars/ next to this playbook
    # (playbook-adjacent). The two are found by different mechanisms, so a run
    # that finds one is no evidence it found the other.
    - name: Host must declare the branching vars the roles gate on
      ansible.builtin.assert:
        that:
          - form_factor in ['laptop', 'desktop']
          - gpu in ['intel', 'nvidia']
          - install_steam is boolean
          - install_vpn is boolean
          - qtile_version is defined
        fail_msg: >-
          inventory/host_vars/{{ inventory_hostname }}.yml is missing or
          malformed, or group_vars/all.yml was not picked up.
        quiet: true
      tags: always

    # Read off ansible's own fact code rather than guessed: OSDIST_LIST[0] is
    # {'path': '/etc/arch-release', 'name': 'Archlinux', 'allowempty': True}
    # and process_dist_files short-circuits on it, so CachyOS — which uses
    # Arch's `filesystem` package and therefore has an empty /etc/arch-release
    # — reports distribution 'Archlinux'. The string 'CachyOS' appears nowhere
    # in that file.
    #
    # There is deliberately no version clause. ansible_distribution_version
    # comes from the `distro` library, which on rolling Arch has nothing to
    # report and answers 'NA'. Asserting on it would fail every run.
    - name: Only Arch-family systems are supported
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Archlinux'
        fail_msg: >-
          Found {{ ansible_distribution }} ({{ ansible_os_family }}). Every
          role here installs with community.general.pacman; there is no apt
          path left to fall back to — it was deleted rather than branched when
          this playbook was retargeted at CachyOS.
        quiet: true
      tags: always

    - name: Report what this run resolved
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ ansible_distribution }}
          {{ ansible_distribution_version }}): form_factor={{ form_factor }}
          gpu={{ gpu }} steam={{ install_steam }} vpn={{ install_vpn }}
          user={{ ansible_user_id }} home={{ ansible_env.HOME }}
          dotfiles={{ dotfiles_dir }}
      tags: always

  # Ordered as they must run. Only two orderings are load-bearing: toolchains
  # installs uv, which the qtile role then uses, and apps names the AUR list
  # that the aur role immediately after it consumes. Every role is
  # independently runnable with --tags.
  #
  # `aur` sits after `apps`, not before it: role defaults are resolved as the
  # play is built rather than as each role runs, so nothing needs that ordering
  # to see apps_aur_packages — and nothing earlier in the play needs an AUR
  # package at install time. yaru-icon-theme is the only AUR package another
  # role's config names, and rofi reads its icon theme at runtime. (The one
  # case that would flip this is a pre-Turing NVIDIA card needing an AUR DKMS
  # driver; see roles/gpu. cnick's 3060 Ti is Ampere, so it does not arise.)
  roles:
    - {role: base, tags: [base]}
    - {role: fonts, tags: [fonts]}
    - {role: toolchains, tags: [toolchains]}
    - {role: xorg, tags: [xorg]}
    - {role: gpu, tags: [gpu]}
    - {role: display_manager, tags: [display-manager, dm]}
    - {role: qtile, tags: [qtile]}
    - {role: desktop_apps, tags: [desktop-apps]}
    - {role: dotfiles, tags: [dotfiles]}
    - {role: neovim, tags: [neovim]}
    - {role: apps, tags: [apps]}
    # Passed explicitly rather than read from inside the role, so the coupling
    # is visible in the play and so the role can be run alone while iterating:
    #     ansible-playbook site.yml --tags aur -e '{"aur_packages":["gitkraken"]}'
    # which is worth having on a role whose failure mode is a ten-minute build.
    - role: aur
      tags: [aur]
      vars:
        aur_packages: "{{ apps_aur_packages }}"
    - {role: vpn, tags: [vpn], when: install_vpn | bool}
    - {role: spotify_now_playing, tags: [spotify]}
    - {role: identity, tags: [identity]}
