---
# Redundant on Ubuntu 24.04 as bootstrap.sh installs it: the apt `ansible`
# package (9.2.0) already bundles every collection below. Kept because it records the floor these roles are written against, and
# because it becomes load-bearing the moment ansible arrives as `ansible-core`
# or from pip instead.
collections:
  - name: community.general      # snap:, ini_file:
    version: ">=8.3.0"
  - name: community.crypto       # openssh_keypair: (roles/identity)
    version: ">=2.17.1"
