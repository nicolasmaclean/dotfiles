---
- name: Update the apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade everything already installed
  become: true
  ansible.builtin.apt:
    upgrade: dist
  when: base_dist_upgrade | bool

- name: Set the timezone
  become: true
  community.general.timezone:
    name: "{{ system_timezone }}"

# gsimplecal/config names this locale explicitly (force_lang = en_US.utf8, for
# Sunday-first weeks) and silently falls back to C if it is not generated, so
# this is not the usual boilerplate locale task.
- name: Generate the locale gsimplecal names
  become: true
  community.general.locale_gen:
    name: "{{ system_locale }}"
    state: present

- name: Install the base packages
  become: true
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

# brightnessctl writes /sys/class/backlight, which is root-owned. Two things
# make that work unprivileged and they are useless apart: the video group, and
# the udev rule that chgrps the sysfs attributes to it. The rule is shipped by
# brightness-udev — do not hand-write /lib/udev/rules.d/90-brightnessctl.rules.
- name: Install the brightnessctl udev rule (laptop only — a desktop has no panel)
  become: true
  ansible.builtin.apt:
    name: brightness-udev
    state: present
  when: form_factor == 'laptop'

- name: Put the user in the video group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: video
    append: true
  when: form_factor == 'laptop'
  notify: Warn about the video group

- name: Read the enabled foreign architectures
  ansible.builtin.command:
    cmd: dpkg --print-foreign-architectures
  register: base_foreign_arches
  changed_when: false
  check_mode: false
  when: install_steam | bool

# Steam is 32-bit, so without this the steam-installer package has no
# installable dependencies at all and apt fails with an unhelpful conflict.
- name: Enable i386 multiarch for Steam
  become: true
  ansible.builtin.command:
    cmd: dpkg --add-architecture i386
  changed_when: true
  when:
    - install_steam | bool
    - "'i386' not in base_foreign_arches.stdout_lines"
  notify: Refresh the apt cache

# The i386 lists do not exist until the cache is refreshed, so this has to
# happen before the apps role reaches steam-installer rather than at the end
# of the play.
- name: Refresh the cache before any later role installs a 32-bit package
  ansible.builtin.meta: flush_handlers
