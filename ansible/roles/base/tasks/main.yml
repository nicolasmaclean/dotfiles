---
# One task, not the two apt needed. pacman's sync-then-upgrade is a single
# transaction and splitting it is exactly the partial upgrade that is
# unsupported on a rolling distro — see defaults/main.yml for why there is no
# longer a knob to skip it.
- name: Sync the databases and upgrade everything
  become: true
  community.general.pacman:
    update_cache: true
    upgrade: true

- name: Set the timezone
  become: true
  community.general.timezone:
    name: "{{ system_timezone }}"

# gsimplecal/config names this locale explicitly (force_lang = en_US.utf8, for
# Sunday-first weeks) and silently falls back to C if it is not generated. On
# Ubuntu that was near-boilerplate; on a minimal Arch install *no* locale is
# generated at all, so this is the only thing standing between gsimplecal and
# the C locale. The module edits /etc/locale.gen and runs locale-gen, which is
# exactly the Arch mechanism — its /var/lib/locales/supported.d/ code path is
# Debian-specific and simply does not fire here.
- name: Generate the locale gsimplecal names
  become: true
  community.general.locale_gen:
    name: "{{ system_locale }}"
    state: present

- name: Install the base packages
  become: true
  community.general.pacman:
    name: "{{ base_packages }}"
    state: present

# See defaults: a minimal CachyOS install may hand the user fish, and
# roles/dotfiles appends a source line to ~/.bashrc that fish never reads.
# Settle which shell it actually is with `getent passwd $USER`.
- name: Make bash the login shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: "{{ base_login_shell }}"
  when: base_login_shell | length > 0

# TODO(unick): laptop-only and deliberately not converted, because no laptop
# runs this playbook yet. There is no `brightness-udev` on Arch, and
# extra/brightnessctl ships *only* the binary — verified, 10 files, none under
# udev/ — depending on systemd-libs, which suggests Arch builds it against
# logind's SetBrightness D-Bus method rather than the sysfs-plus-udev route
# described below. If that is right, neither a udev rule nor the video group is
# needed at all and both of these tasks disappear. Check `brightnessctl set
# 50%` as a normal user first.
#
# The Ubuntu rationale, kept because it cost a round to learn: brightnessctl
# writes /sys/class/backlight, which is root-owned. Two things make that work
# unprivileged and they are useless apart — the video group, and the udev rule
# that chgrps the sysfs attributes to it. The rule was shipped by
# brightness-udev; do not hand-write /lib/udev/rules.d/90-brightnessctl.rules.
- name: Note that the laptop backlight path is unconverted
  ansible.builtin.debug:
    msg: >-
      form_factor=laptop: brightnessctl's udev rule has no packaged Arch
      equivalent. Confirm brightnessctl works unprivileged before assuming this
      is a gap — see the TODO in roles/base/tasks/main.yml.
  when: form_factor == 'laptop'

- name: Put the user in the video group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: video
    append: true
  when: form_factor == 'laptop'
  notify: Warn about the video group

# Steam is 32-bit. On Arch that is the [multilib] repository rather than a
# foreign dpkg architecture. CachyOS very likely ships it enabled already —
# Steam is a headline use case — so this is written as an uncomment that
# matches nothing when the block is already live, rather than as an append that
# would duplicate the section. Idempotent by construction: no match, no change,
# no handler. Settle which it is with `grep -c '^\[multilib\]' /etc/pacman.conf`.
- name: Enable the [multilib] repository for Steam
  become: true
  ansible.builtin.replace:
    path: /etc/pacman.conf
    # [ \t] rather than \s throughout: \s would swallow the blank line after
    # the Include and silently reflow the file. This matches the commented pair
    # exactly as pacman.conf ships it, and matches nothing once it is live —
    # which is what makes the task idempotent without a guard task in front.
    # It does not match [multilib-testing], which is a different section.
    regexp: '^#[ \t]*\[multilib\][ \t]*\n#[ \t]*(Include[ \t]*=[ \t]*\S+)[ \t]*$'
    replace: '[multilib]\n\1'
    backup: true
  when: install_steam | bool
  notify: Sync the pacman databases

# The [multilib] db does not exist until the sync above runs, so this has to
# happen before the apps role reaches steam rather than at the end of the play.
- name: Sync the databases before any later role installs a 32-bit package
  ansible.builtin.meta: flush_handlers
