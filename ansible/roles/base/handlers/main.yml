---
# Group membership is established at login, not by usermod, so brightnessctl
# keeps failing until the session is restarted even though the run succeeded.
- name: Warn about the video group
  ansible.builtin.debug:
    msg: >-
      Added {{ ansible_facts['user_id'] }} to the video group. Group membership only
      takes effect on a new login, so the XF86MonBrightness keys will not work
      until you log out and back in.

# The [multilib] database does not exist until it is synced, and roles/apps
# reaches `steam` later in the same play.
- name: Sync the pacman databases
  become: true
  community.general.pacman:
    update_cache: true
