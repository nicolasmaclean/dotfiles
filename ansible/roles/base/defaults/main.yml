---
# There is no base_dist_upgrade knob any more, and its removal is not cosmetic.
# On Ubuntu it was a convenience for a quick targeted re-run. On a rolling
# distro a partial upgrade — installing a new package against a stale sync
# database — is the documented way to break the system, so the upgrade in
# tasks/main.yml is unconditional. It is also what keeps linux-cachyos and
# linux-cachyos-nvidia-open (roles/gpu) moving in the same transaction, which
# they must.

base_packages:
  - base-devel      # the build-essential of Arch: ships make, and is what paru builds with
  - git
  - curl            # in core, so already present — named so the dependency is written down
  - unzip
  - ca-certificates
  # A minimal CachyOS install has almost no fonts. Without these, every
  # non-glyph character in quickshell, the greeter and GTK dialogs falls back
  # to nothing.
  # The Nerd Font the bar needs is roles/fonts; these are the fallbacks under it.
  - ttf-dejavu
  - noto-fonts
  - ttf-nerd-fonts-symbols
  - ttf-nerd-fonts-symbols-mono
  # Pairing the mouse. bluetui pulls in bluez (the daemon) itself; bluez-utils
  # is named for bluetoothctl as the fallback. The service is enabled in tasks.
  - bluetui
  - bluez-utils
  # The login shell and everything the repo's .zshrc sources. Here rather than
  # in roles/apps because the shell is switched below, in this role, and
  # pointing a login at a shell that is not installed locks it out.
  - zsh
  - zsh-completions
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - zsh-history-substring-search
  - oh-my-zsh-git   # cachyos/oh-my-zsh-git; on plain Arch this is AUR-only
  - fzf             # for oh-my-zsh's fzf plugin

# The login shell. The CachyOS ISO ships fish 4.8.1 plus fish-autopair and
# fish-pure-prompt — a distro does not package a prompt theme for a shell it
# does not intend you to use — so a minimal install may well hand the user
# fish, which reads neither .zshrc nor .bashrc. Porting to fish is real work
# (gitll is a bash function wrapping an embedded awk program); zsh runs it
# unchanged from .shellrc. Set to "" to leave whatever the installer chose alone.
base_login_shell: /usr/bin/zsh

# The kernel command line, as GRUB_CMDLINE_LINUX_DEFAULT. The first three are
# the CachyOS installer's own. The rest keep the boot text off the screen so
# Plymouth hands straight to the greeter: `quiet` silences systemd's [ OK ]
# lines (loglevel=3 only covers the kernel's), rd.udev.log_level does the same
# for udev in the initramfs, and the cursor flag hides the blinking console
# cursor between Plymouth and cage.
base_kernel_cmdline: >-
  nowatchdog nvme_load=YES splash quiet loglevel=3
  rd.udev.log_level=3 vt.global_cursor_default=0
