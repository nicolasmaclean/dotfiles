---
# extra/neovim is 0.12.5, so the PPA this role used to detect and add is gone
# with the whole apt story. after/plugin/lsp.lua's modern vim.lsp API needs
# 0.12.x and gets it from the repo.
neovim_packages:
  - neovim
  - python-pynvim
  - nodejs         # intelephense is an npm package
  - npm

# The servers after/plugin/lsp.lua registers. On Ubuntu these came four
# different ways — apt for clangd, uv tools for ruff and pyright, a pinned
# GitHub tarball plus a PATH symlink for lua-language-server — and three of
# those routes existed only because the archive had no candidate. All four are
# packages here, and extra/lua-language-server is 3.19.1, exactly the version
# the old lua_ls_version pin named.
#
# clangd is shipped by the `clang` package rather than one of its own.
neovim_lsp_packages:
  - clang
  - lua-language-server
  - ruff
  - pyright

neovim_packer_dir: "{{ ansible_facts['env']['HOME'] }}/.local/share/nvim/site/pack/packer/start/packer.nvim"
