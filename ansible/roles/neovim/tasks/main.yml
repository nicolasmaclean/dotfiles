---
- name: Install neovim and its runtime dependencies
  become: true
  community.general.pacman:
    name: "{{ neovim_packages }}"
    state: present

- name: Install the LSP servers
  become: true
  community.general.pacman:
    name: "{{ neovim_lsp_packages }}"
    state: present

# Still npm, because there is no package for it — and npm is the route
# upstream ships. `global: true` with become, so it lands in /usr/lib/node_modules
# and on PATH for the bare `intelephense` lsp.lua asks for.
- name: Install intelephense
  community.general.npm:
    name: intelephense
    global: true
    state: present
  become: true

# packer.nvim is unmaintained upstream. Out of scope here, but a lazy.nvim
# migration is the natural follow-up and is the highest-value one left in this
# repo — nvim/lua/nick/packer.lua is the file that would change.
- name: Bootstrap packer.nvim
  ansible.builtin.git:
    repo: https://github.com/wbthomason/packer.nvim
    dest: "{{ neovim_packer_dir }}"
    depth: 1
    version: master
    update: false
  register: neovim_packer

- name: Sync the plugins
  ansible.builtin.command:
    cmd: nvim --headless -c "autocmd User PackerComplete quitall" -c PackerSync
  changed_when: true
  when:
    - neovim_packer is changed
    - not ansible_check_mode
