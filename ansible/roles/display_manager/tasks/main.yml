---
# greetd rather than a DM with its own UI: it only authenticates and starts
# the session, and the greeter is whatever command its config names. That
# keeps tuigreet swappable for a Quickshell greeter later without touching
# anything but config.toml.
#
# The package creates the `greeter` user (sysusers.d) and tuigreet's
# /var/cache/tuigreet for --remember (tmpfiles.d), so neither needs a task.
- name: Install greetd and tuigreet
  become: true
  community.general.pacman:
    name:
      - greetd
      - greetd-tuigreet
    state: present

# config.toml is in the package's backup=(), so pacman keeps this over the
# packaged one on upgrade and leaves a .pacnew instead.
- name: Configure greetd
  become: true
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/greetd/config.toml
    mode: "0644"
    backup: true

# The lightdm package shipped these lines in its own PAM file; greetd's does
# not. Without them the login keyring is never unlocked with the login
# password, and the first app to touch it prompts for it instead. Also a
# backup=() file, so the edit survives upgrades.
#
# The leading `-` makes PAM skip the line quietly if gnome-keyring is ever
# uninstalled, rather than logging a missing-module error on every login.
- name: Unlock the login keyring at login
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pam.d/greetd
    line: "{{ item.line }}"
    insertafter: "{{ item.after }}"
    backup: true
  loop:
    - line: "-auth       optional     pam_gnome_keyring.so"
      after: '^auth\s+include\s+system-local-login'
    - line: "-session    optional     pam_gnome_keyring.so auto_start"
      after: '^session\s+include\s+system-local-login'

# There is no /etc/X11/default-display-manager task, and it was not dropped by
# accident: that file is Debian's mechanism for choosing the boot-time greeter
# and has no meaning on Arch. Here `systemctl enable greetd` creates the
# display-manager.service alias symlink, and that is the whole story.
#
# That alias is also why this fails if another display manager is still
# enabled: systemd will not overwrite its symlink. Disable the old one first.
#
# Skipped in check mode on purpose. The install task above only *reports* that
# it would install greetd when checking, so the unit genuinely does not exist
# yet and systemd answers "Could not find the requested service greetd".
- name: Enable the greetd service
  become: true
  ansible.builtin.systemd_service:
    name: greetd
    enabled: true
  when: not ansible_check_mode

# gnome-keyring's PAM auto-unlock has been observed flaky on this CachyOS
# stack (first seen under LightDM): on a fresh boot the daemon can end up
# claiming a `login` collection exists - it shows up in ReadAlias and the
# Collections property - without ever actually exporting that object on the
# session bus. Any app that then touches the default keyring (ProtonVPN's
# sign-in did) hangs forever with no error, no prompt, and nothing in its own
# log to point at gnome-keyring at all.
#
# A collection that is merely *locked* is normal - nothing has asked to
# unlock it yet - and is not this bug. The tell is the object not existing,
# which is what this checks: `Locked` fails with "does not exist" only in the
# broken phantom-collection state, never for an ordinary locked-but-real one.
- name: Check whether the login keyring collection is actually exported
  ansible.builtin.command:
    cmd: >-
      busctl --user get-property org.freedesktop.secrets
      /org/freedesktop/secrets/collection/login
      org.freedesktop.Secret.Collection Locked
  register: display_manager_login_keyring
  failed_when: false
  changed_when: false

- name: Warn if the login keyring is stuck in the broken phantom-collection state
  ansible.builtin.debug:
    msg: >-
      gnome-keyring's `login` collection is not actually exported on the
      session bus, even though the daemon claims it exists. Apps that touch
      the default keyring (ProtonVPN's sign-in, browsers saving passwords,
      etc.) will hang indefinitely with no error. Recover with:
        rm -f ~/.local/share/keyrings/login.keyring
      then log out and back in through greetd so PAM recreates it from your
      actual login password - do not retype the password by hand in a
      terminal for this, a mismatch there is unrecoverable except by
      repeating this same deletion. If it recurs every boot, the
      greetd/pam_gnome_keyring auto-unlock handoff is broken on this box and
      needs a real fix rather than repeating this workaround.
  when: >-
    display_manager_login_keyring.rc != 0 and
    'does not exist' in (display_manager_login_keyring.stderr | default(''))
