---
# LightDM rather than GDM or SDDM: GDM drags in a large part of GNOME, defaults
# to a Wayland seat qtile cannot use, and stores the per-user default session in
# AccountsService — which is what set-default-session.sh existed to poke.
# LightDM keeps all of that in one config file this role owns.
- name: Install LightDM and its greeter
  become: true
  community.general.pacman:
    name:
      - lightdm
      - lightdm-gtk-greeter
    state: present

- name: Create the LightDM drop-in directory
  become: true
  ansible.builtin.file:
    path: /etc/lightdm/lightdm.conf.d
    state: directory
    mode: "0755"

- name: Configure the qtile seat
  become: true
  ansible.builtin.template:
    src: 50-qtile.conf.j2
    dest: /etc/lightdm/lightdm.conf.d/50-qtile.conf
    mode: "0644"
    backup: true

# There is no /etc/X11/default-display-manager task any more, and it was not
# dropped by accident: that file is Debian's mechanism for choosing the
# boot-time greeter and has no meaning on Arch. Here `systemctl enable lightdm`
# creates the display-manager.service alias symlink, and that is the whole
# story — so the enable below is the only thing needed.
#
# Skipped in check mode on purpose. The install task above only *reports* that
# it would install lightdm when checking, so the unit genuinely does not exist
# yet and systemd answers "Could not find the requested service lightdm" — a
# dry run would fail here on any box that does not already have LightDM.
- name: Enable the LightDM service
  become: true
  ansible.builtin.systemd_service:
    name: lightdm
    enabled: true
  when: not ansible_check_mode

# Off unless the host asks. On a machine you are logged into, removing the
# running display manager can end the session you are running this from. Empty
# on cnick, which arrives with no greeter.
- name: Remove the conflicting display managers
  become: true
  community.general.pacman:
    name: "{{ display_manager_conflicting }}"
    state: absent
  when:
    - display_manager_conflicting | length > 0
    - display_manager_purge_conflicting | bool

- name: Disable the conflicting display managers without removing them
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
  loop: "{{ display_manager_conflicting }}"
  register: display_manager_disable
  failed_when: false
  changed_when: display_manager_disable.changed | default(false)
  when:
    - not (display_manager_purge_conflicting | bool)
    - not ansible_check_mode

# gnome-keyring's PAM auto-unlock (session pam_gnome_keyring.so auto_start,
# shipped by the lightdm package itself, not this role) has been observed
# flaky on this CachyOS+LightDM stack: on a fresh boot the daemon can end up
# claiming a `login` collection exists - it shows up in ReadAlias and the
# Collections property - without ever actually exporting that object on the
# session bus. Any app that then touches the default keyring (ProtonVPN's
# sign-in did) hangs forever with no error, no prompt, and nothing in its own
# log to point at gnome-keyring at all.
#
# A collection that is merely *locked* is normal - nothing has asked to
# unlock it yet - and is not this bug. The tell is the object not existing,
# which is what this checks: `Locked` fails with "does not exist" only in the
# broken phantom-collection state, never for an ordinary locked-but-real one.
- name: Check whether the login keyring collection is actually exported
  ansible.builtin.command:
    cmd: >-
      busctl --user get-property org.freedesktop.secrets
      /org/freedesktop/secrets/collection/login
      org.freedesktop.Secret.Collection Locked
  register: display_manager_login_keyring
  failed_when: false
  changed_when: false

- name: Warn if the login keyring is stuck in the broken phantom-collection state
  ansible.builtin.debug:
    msg: >-
      gnome-keyring's `login` collection is not actually exported on the
      session bus, even though the daemon claims it exists. Apps that touch
      the default keyring (ProtonVPN's sign-in, browsers saving passwords,
      etc.) will hang indefinitely with no error. Recover with:
        rm -f ~/.local/share/keyrings/login.keyring
      then log out and back in through LightDM so PAM recreates it from your
      actual login password - do not retype the password by hand in a
      terminal for this, a mismatch there is unrecoverable except by
      repeating this same deletion. If it recurs every boot, the
      LightDM/pam_gnome_keyring auto-unlock handoff is broken on this box and
      needs a real fix rather than repeating this workaround.
  when: >-
    display_manager_login_keyring.rc != 0 and
    'does not exist' in (display_manager_login_keyring.stderr | default(''))
