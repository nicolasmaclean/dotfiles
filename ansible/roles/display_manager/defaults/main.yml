---
display_manager_greeter: quickshell

# The VT greetd runs on. The greetd unit's TTYPath= drop-in clears this same
# VT, so the two are one var rather than two literals that can drift.
display_manager_vt: 1

# Where the Quickshell greeter's config is copied. The greeter user cannot read
# /home/nick, so it lives beside the session entry instead.
display_manager_greeter_dir: "{{ hyprland_session_entry | dirname }}/greeter"

# The greeter user's home is /, which it cannot write. Quickshell's cache (QML
# cache, crash reports) goes here instead, via XDG_CACHE_HOME.
display_manager_greeter_cache_dir: /var/cache/qs-greeter

# Autologin skips the greeter entirely: greetd runs
# display_manager_session_command straight away as this user on the first
# start after boot, and only shows tuigreet after that session ends.
display_manager_autologin: false

# What tuigreet runs when no session is remembered yet, and what autologin
# runs. The same line as the Exec= in hypr/hyprland-uwsm.desktop.j2 — a
# session picked in tuigreet runs that entry's Exec= instead, so this is only
# the default.
display_manager_session_command: "uwsm start -e -D Hyprland {{ hyprland_session_entry }}"
