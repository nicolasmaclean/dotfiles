---
hyprland_packages:
  - hyprland
  - xdg-desktop-portal-hyprland
  - xdg-desktop-portal-gtk
  - uwsm
  - libnewt
  - hyprpolkitagent
  - hyprlock
  - hypridle
  - quickshell
  - matugen
  - hyprpaper
  - hyprlauncher
  - hyprpwcenter
  - hyprsunset
  - hyprpicker
  - cliphist
  - wl-clipboard
  # uwsm/env exports QT_QPA_PLATFORMTHEME=gtk3; the plugin that reads it ships
  # with qt5-base/qt6-base, and gtk3 is named here so it has something to
  # read. Also carries the schema desktop_apps' color-scheme gsetting writes.
  - gtk3
  
  # xdph's Screenshot portal shells out to grim, and only registers the
  # interface if grim is on PATH when it starts. Without it flameshot's portal
  # call fails with "Unknown method Screenshot" and flameshot reports only
  # "unable to capture screen". slurp is xdph's region picker.
  - grim
  - slurp

hyprland_daemons:
  - hyprpolkitagent.service
  - hyprpaper.service
  - hypridle.service

hyprland_theme_seed: "#47105E"
hyprland_theme_mode: dark

hyprland_nvidia_packages:
  - libva-nvidia-driver

# Where the plain (non-uwsm) session entry goes. Deliberately outside any
# wayland-sessions directory so no greeter lists it; only uwsm, given this
# path, ever reads it.
hyprland_session_entry: /usr/local/share/hyprland-dotfiles/hyprland.desktop

# Session entries the hyprland package ships, hidden from the greeter via
# pacman's NoExtract so they are never installed.
hyprland_packaged_sessions:
  - /usr/share/wayland-sessions/hyprland.desktop
  - /usr/share/wayland-sessions/hyprland-uwsm.desktop
