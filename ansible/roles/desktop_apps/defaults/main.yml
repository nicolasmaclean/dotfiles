---
desktop_apps_packages:
  - dolphin
  - playerctl
  # The bar's brightness slider, the brightness keys and hypridle all drive the
  # panel through this.
  - brightnessctl
  - flameshot
  - gsimplecal              # the calendar the bar clock opens
  - networkmanager          # not enabled by the package on Arch — see tasks/
  - libnotify               # notify-send, for testing the bar's notifications
  - ibus
  - ibus-libpinyin
  # Arch splits what Ubuntu's `pipewire` pulled in, so the compatibility
  # shims have to be named: without pipewire-pulse nothing implements the
  # PulseAudio API, and wpctl (the volume keys) has nothing to talk to.
  - pipewire
  - pipewire-pulse
  - pipewire-alsa
  - wireplumber             # the volume keys in hyprland.lua drive wpctl

# preload-engines is the list ibus honours outside a GNOME session. GNOME's own
# org.gnome.desktop.input-sources is not read here, so an engine missing from
# this key cannot be selected at all.
#
# The daemon that reads these is started by autostart-apps/ibus.service,
# installed and enabled by roles/autostart_apps — nothing on a no-DE Arch
# install starts it otherwise.
desktop_apps_gsettings:
  - key: org.freedesktop.ibus.general preload-engines
    value: "['xkb:us::eng', 'libpinyin']"
  # The bar draws its own input-source indicator, so ibus's GTK tray icon would
  # be a second one saying the same thing. Only the icon is hidden —
  # ibus-ui-gtk3 keeps running, because it also draws the pinyin candidates.
  - key: org.freedesktop.ibus.panel show-icon-on-systray
    value: "false"
  # org.gnome.desktop.interface, not an ibus namespace, but its schema
  # ships in gsettings-desktop-schemas, which arrives here as a transitive
  # dependency of gtk3 (roles/hyprland) via at-spi2-core — no extra package
  # needed. GTK3.24+/GTK4 read this key directly without a running portal, so
  # Adwaita and any theme that ships a dark variant switch on its own; Firefox
  # and other GTK apps follow suit.
  - key: org.gnome.desktop.interface color-scheme
    value: "'prefer-dark'"
