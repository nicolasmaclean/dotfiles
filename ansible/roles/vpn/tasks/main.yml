---
- name: Install the Proton VPN app
  become: true
  community.general.pacman:
    name: "{{ vpn_package }}"
    state: present

# protonvpn.service is installed and enabled by the qtile role along with the
# rest of the session, gated on this same install_vpn flag. Login stays manual:
# the app keeps its own credentials and there is nothing here to template.
#
# Worth one check on first run: the laptop had 0.10.1 and this is 4.18.1. The
# session unit passes --start-minimized, and its comment explains why that flag
# matters (the tray icon needs the bar's StatusNotifier to already own the
# watcher name). Confirm the flag survived four major versions with
# `protonvpn-app --help`.
- name: Note the manual step
  ansible.builtin.debug:
    msg: >-
      Proton VPN is installed. Sign in once from the tray app; the session unit
      starts it minimised on every login.
