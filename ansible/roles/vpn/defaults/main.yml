---
# extra/proton-vpn-gtk-app 4.18.1, and it is verified to ship
# usr/bin/protonvpn-app — which is exactly the ExecStart in
# qtile/session/protonvpn.service, so the unit needs no change.
#
# On Ubuntu this was a metapackage (proton-vpn-gnome-desktop) reached through a
# release .deb that installed the apt repository, because `protonvpn-app` had
# no candidate there. All of that is gone: the download, the cache directory,
# the stat guard, the `not ansible_check_mode` block and the cache handler.
vpn_package: proton-vpn-gtk-app
