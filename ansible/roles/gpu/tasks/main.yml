---
# `gpu` is which card drives X, not which cards are present — unick has a GTX
# 1650 sitting next to the UHD 630 and still takes the intel branch, because
# PRIME is set to on-demand and X runs on i915.
#
# Unlike Ubuntu, a minimal Arch install does not include mesa, so the intel
# branch is no longer a debug message. modesetting rather than
# xf86-video-intel: the DDX driver is unmaintained and worse on modern parts.
# Laptop-only today, and therefore untested.
- name: Install the Intel graphics stack
  become: true
  community.general.pacman:
    name:
      - mesa
      - vulkan-intel
    state: present
  when: gpu == 'intel'

# THE CONSTRAINT THAT SHAPES THIS BRANCH: nvidia-dkms no longer exists in the
# Arch repositories. What exists is extra/nvidia-open and extra/nvidia-open-dkms
# at 610.57.04, and the package metadata says why — nvidia-open carries
# replaces=['nvidia<=580.119.02-2'] and nvidia-open-dkms carries
# replaces=['nvidia-dkms']. The proprietary kernel module was not renamed, it
# was superseded at the 580 branch and the open module took its name.
#
# nvidia-open supports Turing and newer only. cnick's RTX 3060 Ti is Ampere
# (GA104), two generations past that, so this resolves the easy way: everything
# comes from the repos and no AUR build sits in the path to a desktop.
#
# If a pre-Turing card ever runs this playbook, that is not a small edit. It
# needs the last proprietary branch that supports it — AUR nvidia-580xx-dkms
# (Maxwell/Pascal/Volta) or nvidia-470xx-dkms (Kepler) — which means DKMS on a
# rolling custom kernel, and it means the `aur` role has to move ahead of this
# one in site.yml with its package list split in two.
- name: NVIDIA
  when: gpu == 'nvidia'
  become: true
  block:
    # From host_vars. No detection step: see defaults/main.yml on chwd.
    - name: Install the NVIDIA driver packages
      community.general.pacman:
        name: "{{ nvidia_packages }}"
        state: present

    # nouveau and the NVIDIA module cannot both own the card; when nouveau wins
    # the race the X server comes up on the wrong driver and every setting
    # below is silently inert. Probably redundant on Arch — see
    # gpu_blacklist_nouveau in defaults/main.yml for the one command that
    # settles it.
    - name: Blacklist nouveau
      when: gpu_blacklist_nouveau | bool
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-nouveau.conf
        content: |
          # Managed by Ansible (roles/gpu).
          blacklist nouveau
          options nouveau modeset=0
        mode: "0644"
        backup: true
      notify: Rebuild the initramfs

    - name: Create the Xorg drop-in directory
      ansible.builtin.file:
        path: /etc/X11/xorg.conf.d
        state: directory
        mode: "0755"

    # picom composites, but on NVIDIA that is not enough on its own: without a
    # forced composition pipeline a fullscreen video tears regardless of
    # picom's vsync setting.
    - name: Force a full composition pipeline
      ansible.builtin.copy:
        dest: /etc/X11/xorg.conf.d/20-nvidia.conf
        content: |
          # Managed by Ansible (roles/gpu).
          Section "Device"
              Identifier "nvidia"
              Driver     "nvidia"
              Option     "ForceFullCompositionPipeline" "{{ gpu_force_composition_pipeline | ternary('On', 'Off') }}"
              Option     "TripleBuffer" "on"
          EndSection
        mode: "0644"
        backup: true
