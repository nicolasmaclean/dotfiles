---
# Named per host in inventory/host_vars/, not detected. `chwd` is this distro's
# `ubuntu-drivers` and has the same defect the Ubuntu version of this role
# already worked around: it is not idempotent and reports changed on every run.
# Ask it once by hand at install time (`chwd --list`) and write the answer down.
#
# Unprefixed on purpose, and the linter is silenced rather than obeyed: this
# var is written in inventory/host_vars/, which is the whole reason it exists,
# and a gpu_ prefix would read as role-internal in the one file where it is not.
nvidia_packages: []  # noqa: var-naming[no-role-prefix]

# The nouveau blacklist. extra/nvidia-utils ships
# usr/lib/modprobe.d/nvidia-utils.conf and it is very likely that this is
# already in it — in which case this task is redundant and should be turned off
# here rather than left as a second managed file saying the same thing. It is
# still ON because it is UNVERIFIED and the failure mode of being wrong is the
# session coming up on nouveau with the NVIDIA driver silently unused. One
# command settles it on the box:
#     grep -r nouveau /usr/lib/modprobe.d/
gpu_blacklist_nouveau: true

# There is deliberately no gpu_nvidia_drm_modeset var. Hyprland needs DRM/KMS
# modesetting, and on driver 545+ modeset is already the default — this box is
# on 610 — so there is nothing to set.
