---
- name: Write the git identity
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop: "{{ identity_git_config }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the ssh directory
  ansible.builtin.file:
    path: "{{ identity_ssh_dir }}"
    state: directory
    mode: "0700"

# No key material is committed, and none is fetched. A fresh per-host key is
# generated here; what it gets registered with, if anything, is left to you.
# Nothing in this playbook depends on it — the dotfiles remote stays HTTPS.
- name: Look for an existing ssh key
  ansible.builtin.stat:
    path: "{{ identity_ssh_key }}"
  register: identity_existing_key

# Guarded on absence, not left to the module's idempotence. unick already has
# an ed25519 key registered with GitHub, and it carries no comment — so an
# unguarded openssh_keypair reports *changed* purely to write the comment in.
# That is a live private key with a copy on a server: the only safe amount of
# churn is none, and this role exists to give a fresh box a key, not to manage
# one that already works.
- name: Generate a per-host ssh key
  community.crypto.openssh_keypair:
    path: "{{ identity_ssh_key }}"
    type: "{{ identity_ssh_type }}"
    comment: "{{ git_user_email }} ({{ inventory_hostname }})"
    mode: "0600"
  register: identity_key
  when: not identity_existing_key.stat.exists

- name: Read the public key
  ansible.builtin.slurp:
    src: "{{ identity_ssh_key }}.pub"
  register: identity_pubkey
  when: not ansible_check_mode
  failed_when: false

# Printed, never prompted on. Registering this key anywhere is a manual step
# that has nothing to do with provisioning, so the run does not stop for it.
- name: Report this host's public key
  ansible.builtin.debug:
    msg: "{{ identity_pubkey.content | b64decode | trim }}"
  when: identity_pubkey.content is defined
