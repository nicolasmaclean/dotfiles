---
# ═══ uv ═══════════════════════════════════════════════════════════════════
# qtile lives in a uv tool venv rather than in the repos: the venv is what
# keeps the five pinned packages in lockstep, and qtile-extras is AUR-only, so
# a native install would split that set across two package managers. The qtile
# role does the install; this only puts uv on the box.
#
# extra/uv puts the binary at /usr/bin/uv rather than ~/.local/bin/uv where the
# install script put it — group_vars/all.yml's uv_bin is that path and
# roles/qtile reads the same var, which is the only reason this role is
# threaded into another one. `uv tool install` still places the tools it
# installs under ~/.local/bin, so ~/.local/bin/qtile and
# ~/.local/bin/qtile-nested are unaffected.
- name: Install uv
  become: true
  community.general.pacman:
    name: uv
    state: present

# ═══ alacritty ════════════════════════════════════════════════════════════
# From the repo, not cargo. The Ubuntu archive carried only 0.13.2, which is
# why this used to be rustup plus seven build dependencies plus a version-
# guarded `cargo install` plus a hash-directory search of the cargo registry;
# extra/alacritty is 0.17.0 and all of that goes with it. So do three things
# that only existed to paper over a cargo install:
#   - the templated Alacritty.desktop (upstream's bare `Exec=alacritty` only
#     failed to resolve because the binary was in ~/.cargo/bin, which no
#     session PATH carries; from /usr/bin the bare name is fine, and the
#     package ships the entry and the icon itself);
#   - the icon copy out of the unpacked crate source;
#   - `tic -xe alacritty,alacritty-direct` — core/ncurses ships
#     usr/share/terminfo/a/alacritty, alacritty+common and alacritty-direct,
#     and ncurses is always installed.
#
# The version pin is gone too. 0.16.1 → 0.17.0 is one minor version; start it
# once after the switch and read stderr for config deprecations rather than
# fighting a rolling repo.
- name: Install alacritty
  become: true
  community.general.pacman:
    name: alacritty
    state: present
