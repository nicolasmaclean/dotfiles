---
# Alacritty is built from source because the Ubuntu archive carries only
# 0.13.2. These are its build dependencies.
#
# NOTE libfreetype-dev, not libfreetype6-dev: the 6 spelling has no candidate on
# noble at all, so an apt task naming it fails outright.
toolchains_alacritty_build_deps:
  - cmake
  - pkg-config
  - libfreetype-dev
  - libfontconfig1-dev
  - libxcb-xfixes0-dev
  - libxkbcommon-dev
  - python3

toolchains_cargo_bin: "{{ ansible_env.HOME }}/.cargo/bin"
toolchains_uv_bin: "{{ ansible_env.HOME }}/.local/bin/uv"
