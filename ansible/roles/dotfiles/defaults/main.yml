---
# Symlinks, not copies: editing the repo is editing the live config.
#
# Dropping an entry here does not remove its link from a host that already has
# it; move it to dotfiles_removed_links below. roles/qtile_removal does the same
# for the ones the X11 session left behind.
dotfiles_links:
  - src: nvim
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim"
  # flameshot has to sit at its XDG default path: it is started by dbus
  # activation with no way to pass a config flag, so a config anywhere else is
  # read by nothing.
  - src: flameshot
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/flameshot"
  - src: quickshell
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/quickshell"
  - src: cliphist
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/cliphist"
  # A file inside a directory, not a directory link — and it must be this path.
  # Alacritty checks ~/.config/alacritty/alacritty.toml before ~/.alacritty.toml
  # and stops at the first hit, so the two shadow rather than merge.
  - src: alacritty.toml
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/alacritty/alacritty.toml"
  # The terminal xdg-terminal-exec picks for Terminal=true desktop entries,
  # e.g. the arch-update tray's "Run Arch-Update". Without it GLib's fallback
  # list never reaches alacritty and the launch fails silently.
  - src: xdg-terminals.list
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/xdg-terminals.list"
  - src: .ideavimrc
    dest: "{{ ansible_facts['env']['HOME'] }}/.ideavimrc"
  - src: configs/starship.toml
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/starship.toml"

# Links whose config has left the repo. Removed only while they are still
# symlinks — see tasks/main.yml.
dotfiles_removed_links:
  # gsimplecal was replaced by the bar's own calendar widget (hypr/qs).
  - "{{ ansible_facts['env']['HOME'] }}/.config/gsimplecal"

# Flameshot expands neither $HOME nor ~ — verified twice: with either form
# `flameshot full --clipboard` blocks until timeout and saves nothing at all.
# So this has to be a literal absolute path, which is why Ansible owns it.
dotfiles_flameshot_savepath: "{{ ansible_facts['env']['HOME'] }}/Pictures"
