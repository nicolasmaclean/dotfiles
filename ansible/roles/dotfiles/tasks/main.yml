---
# No `mode:` on purpose, and this is not an oversight the linter should talk
# you out of. These directories usually already exist: ~/.config is 0700 on
# this laptop, and setting an explicit 0755 here would widen it on every
# adopted machine — a real permissions regression traded for a cosmetic
# consistency. Omitting mode leaves an existing directory alone and creates a
# missing one under the user's umask.
- name: Create the parent directories the links need  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.config"
    - "{{ ansible_facts['env']['HOME'] }}/.config/alacritty"

# The migration to zsh. ~/.zshrc is the one link target an installer is
# expected to have written already: cachyos-zsh-config puts one in /etc/skel
# that sources its oh-my-zsh + powerlevel10k bundle, and `p10k configure` then
# edits it in place. Left there, the guard below would skip the link and zsh
# would keep drawing p10k instead of starship. So a real file is renamed out
# of the way, never deleted, and never onto an earlier backup — if
# ~/.zshrc.pre-dotfiles already exists this does nothing and the guard below
# reports the file instead.
- name: Look for an installer-written zshrc
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    follow: false
  register: dotfiles_zshrc

- name: Move the installer's zshrc aside
  ansible.builtin.command:
    cmd: mv -n .zshrc .zshrc.pre-dotfiles
    chdir: "{{ ansible_facts['env']['HOME'] }}"
    creates: "{{ ansible_facts['env']['HOME'] }}/.zshrc.pre-dotfiles"
  when:
    - dotfiles_zshrc.stat.exists
    - dotfiles_zshrc.stat.isreg

# The guard that makes adoption safe. A dest that is already a symlink, or
# absent, is ours to write; a dest that is a real file or directory is somebody
# else's config and gets left alone with a warning.
- name: Inspect the link targets
  ansible.builtin.stat:
    path: "{{ item.dest }}"
    follow: false
  loop: "{{ dotfiles_links }}"
  loop_control:
    label: "{{ item.dest }}"
  register: dotfiles_state

- name: Link the config into the checkout
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/{{ item.item.src }}"
    dest: "{{ item.item.dest }}"
    state: link
    force: true
  loop: "{{ dotfiles_state.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when: not item.stat.exists or item.stat.islnk

- name: Report the paths left alone
  ansible.builtin.debug:
    msg: >-
      {{ item.item.dest }} is a real {{ 'directory' if item.stat.isdir else 'file' }},
      not a symlink — left untouched. Move it aside and re-run to pick up the
      repo's copy.
  loop: "{{ dotfiles_state.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when:
    - item.stat.exists
    - not item.stat.islnk

# The same guard from the other side: a symlink is ours to remove, a real
# directory is not. Removing a link never follows it.
- name: Inspect the retired links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ dotfiles_removed_links }}"
  register: dotfiles_removed_state

- name: Remove the retired links
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ dotfiles_removed_state.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.islnk | default(false)

# Gitignored, so a fresh checkout lacks it — but quickshell only fills in the
# qmlls import paths when the file already exists next to shell.qml. Once it
# has, the file is a symlink into quickshell's per-session vfs under
# /run/user, which dangles after a reboot or restart; touching it would follow
# the link and fail. So only create it when nothing — not even a broken link —
# is there, and leave whatever quickshell made alone.
- name: Look for the qmlls config quickshell manages
  ansible.builtin.stat:
    path: "{{ dotfiles_dir }}/{{ item }}/.qmlls.ini"
    follow: false
  loop:
    - quickshell
    - hypr/qs
  register: dotfiles_qmlls

- name: Create the qmlls config quickshell manages
  ansible.builtin.file:
    path: "{{ dotfiles_dir }}/{{ item.item }}/.qmlls.ini"
    state: touch
    mode: "0644"
  loop: "{{ dotfiles_qmlls.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

# ~/.bashrc is the exception: a real file, not a link, with one sourcing line
# appended. Converting it to a symlink would throw away the stock bashrc — from
# /etc/skel here rather than Ubuntu's — which sets up the prompt, history and
# completion this repo's .bashrc assumes.
#
# zsh is the login shell now (roles/base, base_login_shell) and reads the
# linked ~/.zshrc instead, so this only serves bash run by hand. It stays
# because it is cheap and both rc files share .shellrc: an interactive bash
# still gets the editor, aliases and gitll.
#
# The installer does not always leave one. A minimal CachyOS install that hands
# the user fish may write no ~/.bashrc at all, and the append below then stops
# the play twelve roles deep. Seeding from /etc/skel is what useradd would have
# done, and `force: false` means an existing ~/.bashrc is never touched — so
# this is a no-op on every box that already has one, including both of these.
- name: Look for the skeleton bashrc
  ansible.builtin.stat:
    path: /etc/skel/.bashrc
  register: dotfiles_skel_bashrc

- name: Seed the stock bashrc from /etc/skel
  ansible.builtin.copy:
    src: /etc/skel/.bashrc
    dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    remote_src: true
    force: false
    mode: "0644"
  when: dotfiles_skel_bashrc.stat.exists

# create: true rather than false, and only as the second half of the guard
# above: it covers the box with no /etc/skel/.bashrc to copy, where the choice
# is a ~/.bashrc holding just this line or no ~/.bashrc at all. The reason the
# old `create: false` existed — never invent a bashrc when the stock one is
# missing its prompt, history and completion setup — is now served by the seed
# task, which gets the real file whenever the box has one to give.
#
# No `mode:` here, and for the same reason the directory task at the top of
# this file has none: lineinfile applies file attributes to a file that already
# exists, so naming a mode would rewrite the permissions of every adopted
# machine's ~/.bashrc. The seed task above sets 0644 on the one it creates.
- name: Source the repo bashrc from the stock one  # noqa: risky-file-permissions
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    line: "source ~/dotfiles/.bashrc"
    state: present
    create: true
    backup: true

# ~/.alacritty.toml is shadowed by ~/.config/alacritty/alacritty.toml and can
# only confuse; on this laptop it is a second symlink to the same file.
- name: Remove the shadowed alacritty config
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.alacritty.toml"
    state: absent

# ini_file, not template: the file is symlinked into the repo *and* rewritten
# by flameshot itself whenever a setting is changed from its UI, so a template
# would clobber the app's own writes and drop the comments. This sets the one
# key and leaves everything else alone.
#
# Note this writes *into the repo* — the one place the plan otherwise avoids
# writing, unavoidable because the repo file is the live config. It shows as a
# dirty working tree on any host whose username is not nick.
- name: Set flameshot's save path
  community.general.ini_file:
    path: "{{ dotfiles_dir }}/flameshot/flameshot.ini"
    section: General
    option: savePath
    value: "{{ dotfiles_flameshot_savepath }}"
    # Qt's QSettings writes `key=value` with no padding, and flameshot rewrites
    # this file itself whenever a setting is changed from its UI. Without this
    # the task reformats the line to `savePath = ...` on every single run —
    # never idempotent, and a permanently dirty working tree.
    no_extra_spaces: true
    mode: "0644"
    backup: true

- name: Create the screenshot directory flameshot saves into
  ansible.builtin.file:
    path: "{{ dotfiles_flameshot_savepath }}"
    state: directory
    mode: "0755"
