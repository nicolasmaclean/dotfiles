---
# Shipped by nothing on a fresh box, and the single biggest "the clone looks
# broken" gap after the config itself: theme.py asks for "0xProto Nerd Font"
# and every bar glyph plus every dunstrc icon is a Nerd Font codepoint, so
# without this the whole bar renders as boxes.
#
# This is the whole role now. extra/ttf-0xproto-nerd is 3.5.1 — exactly the
# version the old nerd_font_version pin named — so the release-zip download,
# the user font directory, the marker-file guard and the fc-cache handler all
# go. Arch's fontconfig ships a pacman hook that rebuilds the cache after any
# package touching /usr/share/fonts, which is what the handler existed for.
- name: Install the 0xProto Nerd Font
  become: true
  community.general.pacman:
    name: ttf-0xproto-nerd
    state: present
