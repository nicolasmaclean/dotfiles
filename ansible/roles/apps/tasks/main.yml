---
# No repository setup, no keys, no cache refresh, no check-mode guards — see
# defaults/main.yml for the list of what that deleted and why. The AUR half of
# this role's package list is installed by roles/aur, which site.yml runs
# immediately after this one with apps_aur_packages passed in at the call site.
- name: Install the apps
  become: true
  community.general.pacman:
    name: "{{ apps_repo_packages }}"
    state: present

# xdg-settings writes to ~/.config/mimeapps.list, so this runs as the login
# user, not become — matching roles/desktop_apps' gsettings task, read-then-
# write keeps it idempotent since the module itself always reports changed.
- name: Read the current default browser
  ansible.builtin.command:
    cmd: xdg-settings get default-web-browser
  register: apps_current_browser
  changed_when: false
  check_mode: false

- name: Set Firefox as the default browser
  ansible.builtin.command:
    cmd: xdg-settings set default-web-browser firefox.desktop
  when: apps_current_browser.stdout | trim != 'firefox.desktop'

# multilib/steam. roles/base enables the [multilib] repository and flushes its
# handler before this role runs, which is the only reason this resolves.
- name: Install Steam
  become: true
  community.general.pacman:
    name: steam
    state: present
  when: install_steam | bool

# Same multilib dependency as Steam above. wine-mono/wine-gecko are
# deliberately not listed here — Lutris fetches those into the prefix itself
# when it builds one, and pinning them repo-side has a habit of drifting from
# what Lutris actually wants.
- name: Install Lutris and Wine
  become: true
  community.general.pacman:
    name:
      - lutris
      - wine
      - winetricks
      - cabextract      # winetricks dependency for several verbs
      - p7zip
      - gamemode
      - lib32-gamemode
      - umu-launcher    # lets Lutris run Battle.net/Overwatch under Proton instead of plain wine
    state: present
  when: install_battlenet | bool
