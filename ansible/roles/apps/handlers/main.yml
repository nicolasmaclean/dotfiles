---
# Handler names are resolved play-wide, not per role: two roles defining
# "Update the apt cache" means one silently shadows the other, and a notify
# from here lands on whichever was parsed last. The dry run showed exactly
# that — apps' notifications ran `vpn : Update the apt cache`. Identical work
# by luck; the names are role-unique now so it cannot go wrong later.
- name: Update the apt cache for apps
  become: true
  ansible.builtin.apt:
    update_cache: true
