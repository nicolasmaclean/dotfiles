# This playbook is always run *on* the machine it configures, never pushed over
# SSH. The local connection is declared in inventory/hosts.yml rather than here,
# so that it travels with the hosts even if this file is not the config that
# ends up being loaded.
#
# Ansible only reads this file when the current directory is the one holding it,
# so the relative inventory path below is safe: if you run from anywhere else
# the config is not loaded at all and the run fails loudly with an empty host
# list rather than quietly using the wrong inventory.

[defaults]
inventory          = inventory/hosts.yml
interpreter_python = auto_silent
nocows             = True

# Deliberately outside the checkout: a provisioning run must never dirty the
# working tree it was launched from.
log_path           = ~/.ansible/dotfiles.log
