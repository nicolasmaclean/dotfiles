---
# Shared by both hosts. Every pin below was read off the laptop's live install
# on 2026-09-09, not chosen — the point is that a fresh box gets what this one
# is actually running.

# --- identity -------------------------------------------------------------
# Consumed by the `identity` role's ~/.gitconfig template.
git_user_name: "Nick Maclean"
git_user_email: "nick@imaclean.me"

# --- paths ----------------------------------------------------------------
# bootstrap.sh clones here, and qtile/pyrightconfig.json's relative venvPath
# ("../../.local/share/uv/tools") assumes it.
dotfiles_dir: "{{ ansible_env.HOME }}/dotfiles"

# --- version pins ---------------------------------------------------------
# The qtile venv is a single `uv tool install` with four --with packages. That
# list is a contract, not a convenience: spotify_web.py is stdlib-only so the
# now-playing widget adds nothing to it, and these five names are exactly what
# ~/.local/share/uv/tools/qtile/uv-receipt.toml records.
qtile_version: "0.37.0"
qtile_extras_version: "0.37.0"
psutil_version: "7.2.2"
dbus_fast_version: "5.0.22"
pyxdg_version: "0.28"

# Built with cargo, not apt: the Ubuntu archive has only 0.13.2.
alacritty_version: "0.16.1"

# --- system ---------------------------------------------------------------
system_timezone: "America/Chicago"
# gsimplecal/config sets force_lang = en_US.utf8 to get Sunday-first weeks, and
# that must name a locale `locale -a` actually lists.
system_locale: "en_US.UTF-8"

# --- third-party version pins ---------------------------------------------
# Bump these deliberately; each was the current release on 2026-09-09 and each
# URL was checked to resolve.
nerd_font_name: "0xProto"          # theme.py's Fonts.normal and alacritty.toml
nerd_font_version: "3.5.1"
lua_ls_version: "3.19.1"           # not in the Ubuntu archive at all
discord_version: "1.0.157"
slack_version: "4.52.155"
protonvpn_release_version: "1.0.8"

# LSP servers for nvim/after/plugin/lsp.lua. Neither has an apt candidate on
# noble; both are uv tools here.
ruff_version: "0.16.5"
pyright_version: "1.1.411"
