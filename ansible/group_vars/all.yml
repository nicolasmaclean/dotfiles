---
# Shared by both hosts.
#
# Almost every version pin that used to live here is gone. They existed because
# the Ubuntu archive was behind and the packages had to come from tarballs,
# vendor repos and pinned .debs; on a rolling distro every one of them names a
# package pacman versions for us, and a pin against a rolling repo is a task
# that fails on the day the repo moves. The qtile venv is the one exception,
# and its reason is below.

# --- identity -------------------------------------------------------------
# Consumed by the `identity` role's git config tasks.
git_user_name: "Nick Maclean"
git_user_email: "nick@imaclean.me"

# --- paths ----------------------------------------------------------------
# bootstrap.sh clones here, and qtile/pyrightconfig.json's relative venvPath
# ("../../.local/share/uv/tools") assumes it.
dotfiles_dir: "{{ ansible_facts['env']['HOME'] }}/dotfiles"

# extra/uv installs to /usr/bin, not ~/.local/bin as the install script did.
# Read by roles/toolchains (which installs it) and roles/qtile (which uses it);
# the tools uv installs still land in ~/.local/bin, so ~/.local/bin/qtile and
# ~/.local/bin/qtile-nested are unaffected by this path.
uv_bin: /usr/bin/uv

# --- version pins ---------------------------------------------------------
# The qtile venv is a single `uv tool install` with four --with packages. That
# list is a contract, not a convenience: spotify_web.py is stdlib-only so the
# now-playing widget adds nothing to it, and these five names are exactly what
# ~/.local/share/uv/tools/qtile/uv-receipt.toml records.
#
# Kept pinned even though extra/qtile is 0.37.0 and extra/python-psutil is
# 7.2.2 — exactly these two versions — because qtile-extras is AUR-only, so a
# native install would split the five-package set across two package managers
# and give up the lockstep this list exists to hold.
qtile_version: "0.37.0"
qtile_extras_version: "0.37.0"
psutil_version: "7.2.2"
dbus_fast_version: "5.0.22"
pyxdg_version: "0.28"

# --- system ---------------------------------------------------------------
system_timezone: "America/Chicago"
# gsimplecal/config sets force_lang = en_US.utf8 to get Sunday-first weeks, and
# that must name a locale `locale -a` actually lists. A minimal Arch install
# generates none at all, so this is not the boilerplate it looks like.
system_locale: "en_US.UTF-8"
