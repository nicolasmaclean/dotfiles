# picom, the compositor picom.service runs (see qtile/session/picom.service).
# Symlinked to ~/.config/picom by the dotfiles role; picom reads
# $XDG_CONFIG_HOME/picom/picom.conf and takes no flag from the unit.
#
# Two jobs only: make alacritty's transparency composite correctly, and keep
# fullscreen output tear-free on both boxes. No shadows, no fading, no blur -
# nothing here is decoration.

# ═══ backend ══════════════════════════════════════════════════════════════
# glx, not xrender: xrender cannot vsync on NVIDIA at all, and on Intel it
# repaints the whole screen every frame. This is also what the NVIDIA driver's
# ForceFullCompositionPipeline is set up to pair with (the Ansible gpu role).
backend = "glx";
vsync = true;

# Repaint only what changed. Off by default in picom 10 on some drivers; it is
# the difference between an idle compositor costing nothing and costing a
# steady few percent of a core.
use-damage = true;

# NVIDIA's glx driver reorders work behind picom's back, and the symptom is
# torn or stale frames under a moving window. The fence makes picom wait for
# the draw it just issued. Costs a sync per frame and is inert on Intel.
xrender-sync-fence = true;

# ═══ transparency ═════════════════════════════════════════════════════════
# alacritty.toml sets window.opacity = 0.9. Alacritty asks X for an ARGB
# visual and draws its own alpha, so the opacity arrives on the *client*
# window rather than on the frame - which is precisely the case picom ignores
# unless told to look. Without this the terminal is opaque and the setting
# looks broken rather than absent.
detect-client-opacity = true;

# Group a dialog with the window it belongs to, so a transient (alacritty has
# none, but rofi and the polkit agent do) is not treated as an unrelated
# window for the rules below.
detect-transient = true;

# ═══ fullscreen ═══════════════════════════════════════════════════════════
# Hand a fullscreen window the screen directly and step out of the way: no
# composite pass, no extra frame of latency, and a game or a video player gets
# the scanout it would get with no compositor running at all.
#
# The catch is that an unredirected window is no longer vsynced *by picom* - it
# is vsynced by whatever the driver does. That is fine here because both boxes
# are set up for it: Intel vsyncs by default, and the NVIDIA desktop gets
# ForceFullCompositionPipeline from the gpu role. Turn this off first if
# fullscreen ever tears.
unredir-if-possible = true;

# Milliseconds of fullscreen before picom actually lets go. Alt-tabbing through
# a fullscreen window would otherwise unredirect and redirect on every step,
# and each transition is a visible black flash.
unredir-if-possible-delay = 200;

# Two exclusions, both for windows that are fullscreen *and* still need the
# compositor:
#   - anything carrying opacity, because an unredirected window has no
#     compositor to blend it and snaps to fully opaque. That is the fullscreen
#     terminal.
#   - the screenshot overlay, which is a fullscreen window whose whole purpose
#     is to show the desktop behind it.
unredir-if-possible-exclude = [
    "_NET_WM_WINDOW_OPACITY@:c",
    "class_g = 'flameshot'"
];

# ═══ no decoration ════════════════════════════════════════════════════════
# Spelled out rather than left to defaults, so a picom upgrade that changes a
# default cannot quietly add a shadow under every window.
shadow = false;
fading = false;
blur-background = false;
